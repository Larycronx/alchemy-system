<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sistema de Alquimia" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120709"/>
      <stop offset="0.5" stop-color="#2a0f1b"/>
      <stop offset="1" stop-color="#0d0a12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a7a26"/>
      <stop offset="0.5" stop-color="#f3d982"/>
      <stop offset="1" stop-color="#9a7a26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>

    <g id="seal" fill="none" stroke="#c9a227" stroke-linecap="round" stroke-linejoin="round">
      <circle r="92" stroke-width="1.6"/>
      <circle r="84" stroke-width="0.8" stroke-opacity="0.7"/>
      <circle r="84" stroke-width="5" stroke-opacity="0.35" stroke-dasharray="1.5 9.6"/>
      <circle r="62" stroke-width="1.2"/>
      <polygon points="0,-62 53.7,31 -53.7,31" stroke-width="1.6"/>
      <polygon points="0,62 53.7,-31 -53.7,-31" stroke-width="1.6"/>
      <circle r="31" stroke-width="1" stroke-opacity="0.8"/>
      <circle r="5" fill="#c9a227" stroke="none"/>
      <line x1="0" y1="-92" x2="0" y2="-62" stroke-width="0.8" stroke-opacity="0.6"/>
      <line x1="0" y1="92" x2="0" y2="62" stroke-width="0.8" stroke-opacity="0.6"/>
      <line x1="-92" y1="0" x2="-62" y2="0" stroke-width="0.8" stroke-opacity="0.6"/>
      <line x1="92" y1="0" x2="62" y2="0" stroke-width="0.8" stroke-opacity="0.6"/>
    </g>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#vignette)"/>

  <circle cx="140" cy="160" r="150" fill="url(#glow)"/>
  <circle cx="1060" cy="160" r="150" fill="url(#glow)"/>

  <!-- estrelas -->
  <g fill="#f3d982">
    <circle cx="300" cy="62" r="1.4" opacity="0.7"/>
    <circle cx="372" cy="270" r="1.2" opacity="0.5"/>
    <circle cx="455" cy="48" r="1" opacity="0.6"/>
    <circle cx="760" cy="40" r="1.3" opacity="0.7"/>
    <circle cx="842" cy="276" r="1.5" opacity="0.6"/>
    <circle cx="905" cy="70" r="1" opacity="0.5"/>
    <circle cx="250" cy="230" r="1" opacity="0.5"/>
    <circle cx="960" cy="238" r="1.1" opacity="0.5"/>
  </g>

  <!-- selos alquimicos -->
  <use xlink:href="#seal" href="#seal" x="140" y="160"/>
  <use xlink:href="#seal" href="#seal" x="1060" y="160" transform="rotate(180 1060 160)"/>

  <!-- moldura -->
  <rect x="16" y="16" width="1168" height="288" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
  <rect x="26" y="26" width="1148" height="268" fill="none" stroke="#c9a227" stroke-width="0.6" stroke-opacity="0.5"/>
  <g fill="#c9a227">
    <rect x="12" y="12" width="8" height="8" transform="rotate(45 16 16)"/>
    <rect x="1180" y="12" width="8" height="8" transform="rotate(45 1184 16)"/>
    <rect x="12" y="300" width="8" height="8" transform="rotate(45 16 304)"/>
    <rect x="1180" y="300" width="8" height="8" transform="rotate(45 1184 304)"/>
  </g>

  <!-- titulo -->
  <text x="600" y="152" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Times New Roman', serif" font-size="44" letter-spacing="6" fill="url(#gold)">SISTEMA DE ALQUIMIA</text>

  <!-- ornamento -->
  <g stroke="url(#gold)" stroke-width="1" fill="none">
    <line x1="400" y1="176" x2="580" y2="176"/>
    <line x1="620" y1="176" x2="800" y2="176"/>
  </g>
  <rect x="595" y="171" width="10" height="10" fill="#c9a227" transform="rotate(45 600 176)"/>

  <text x="600" y="214" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Times New Roman', serif" font-style="italic" font-size="18" letter-spacing="2" fill="#dccb9f">Conhecimento, experimentação e produção para Foundry VTT</text>
</svg>
